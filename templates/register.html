{% extends "base.html" %}{% block title %}Register{% endblock %}{% block body %}
<form class="box" method="post"><h1>Create account</h1>
<label>Full name</label><input name="name" value="{{ f.name }}" required>
<label>Email</label><input name="email" type="email" value="{{ f.email }}" required>
<label>Password (6+ characters)</label><input name="password" type="password" minlength="6" required>
<label>Register as</label><select name="role"><option value="donor" {{ 'selected' if f.role=='donor' }}>Donor</option><option value="patient" {{ 'selected' if f.role=='patient' }}>Patient</option></select>
<label>Blood group</label><select name="blood_group" required>{% for g in groups %}<option {{ 'selected' if f.blood_group==g }}>{{ g }}</option>{% endfor %}</select>
<label>Phone (10 digits)</label><input name="phone" value="{{ f.phone }}" inputmode="numeric" pattern="\d{10}" required>
<label>City</label><input name="city" value="{{ f.city }}">
<label>Age (donors: 18 to 65)</label><input name="age" type="number" min="1" max="120" value="{{ f.age }}">
<label>Gender</label><select name="gender"><option>Male</option><option>Female</option><option>Other</option></select>
<button>Create account</button></form>{% endblock %}
